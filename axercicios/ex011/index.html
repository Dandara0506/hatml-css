<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos doferentes ou simplismente aumente e diminua o temanho do seu navegador.</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudiosem HTML5.</p>
    <audio src="midia/toccatain.d.mp3" preload="metadata" autoplay controls>
        
            <source src="midia/toccatain.d.mp3" type="audio/mpeg">
            <source src="midia/toccatain.d.ogg" type="audio/ogg">
            <source src="midia/toccatain.d.wav" type="audio/wav">
            <p>infelizmente seu navegador não consegue reproduzir aúdio. <a href="midia/toccatain.d.mp3"> Clique aqui para baixar o arquivo MP3</a></p>
        
    </audio>
</body>
</html>
