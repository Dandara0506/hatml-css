<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('love larry ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /*
        Tipos de format ()
        opentype(otf)
        truetype(ttf)
        embedded-opentype
        truetype(Apple advanced typography)
        svg
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Doloremque doloribus id eaque soluta? Facilis, blanditiis architecto! Nobis officia saepe earum cupiditate sit doloribus at laborum consectetur. Laboriosam exercitationem odio enim!</p>
</body>
</html>
